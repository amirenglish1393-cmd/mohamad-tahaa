<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشاوره</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#064e3b,#10b981,#f59e0b);color:#fff}
.card{width:min(92%,520px);text-align:center;padding:45px 28px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:30px;box-shadow:0 20px 60px rgba(0,0,0,.25);backdrop-filter:blur(12px)}
.icon{font-size:60px}h1{font-size:34px;margin:10px 0}p{font-size:18px;line-height:2;margin-bottom:30px}
.call{display:inline-block;padding:16px 35px;border-radius:50px;background:#fff;color:#047857;text-decoration:none;font-size:20px;font-weight:bold;transition:.2s;box-shadow:0 10px 25px rgba(0,0,0,.18)}
.call:hover{transform:translateY(-3px) scale(1.03)}.number{margin-top:20px;font-size:18px;direction:ltr}
</style>
</head>
<body>
<div class="card">
<div class="icon">📞</div>
<h1>برای مشاوره کلیک کنید</h1>
<p>برای دریافت مشاوره، روی دکمه زیر بزنید تا شماره‌گیر دستگاه شما باز شود.</p>
<a class="call" href="tel:+989108817264">📞 مشاوره</a>
<div class="number">0910 881 7264</div>
</div>
</body>
</html>
